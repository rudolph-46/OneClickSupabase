_format_version: "2.1"

# ─────────────────────────────────────────────────────────────────────────────
# Kong routes all public traffic to the correct internal Supabase service.
# All upstream URLs use Railway PRIVATE networking (not public domains).
#
# NOTE (Railway fork fix): Kong does NOT expand $(VAR) shell syntax in
# declarative config, so upstreams are hardcoded to the stable private
# hostnames/ports. Only true secrets (API keys) use vault references,
# which Kong resolves from environment variables at boot.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgREST — REST API ────────────────────────────────────────────────────
  - name: rest-v1
    url: http://rest.railway.internal:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  # ── GoTrue — Auth ───────────────────────────────────────────────────────────
  - name: auth-v1
    url: http://auth.railway.internal:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # ── Realtime ─────────────────────────────────────────────────────────────────
  - name: realtime-v1
    url: http://realtime.railway.internal:4000/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  # ── Storage ──────────────────────────────────────────────────────────────────
  - name: storage-v1
    url: http://storage.railway.internal:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  # ── Studio — ONLY accessible on private network (no public route) ────────────
  # Studio is intentionally NOT exposed through Kong.

# ── Global plugins ────────────────────────────────────────────────────────────
plugins:
  - name: key-auth
    config:
      key_names:
        - apikey
        - Authorization
      hide_credentials: false
      anonymous: null

consumers:
  - username: anon
    keyauth_credentials:
      - key: "{vault://env/ANON_KEY}"

  - username: service_role
    keyauth_credentials:
      - key: "{vault://env/SERVICE_ROLE_KEY}"
