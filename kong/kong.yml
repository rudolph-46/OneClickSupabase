_format_version: "2.1"

# ─────────────────────────────────────────────────────────────────────────────
# Kong routes all public traffic to the correct internal Supabase service.
# All upstream URLs use Railway PRIVATE networking (not public domains).
#
# NOTE (Railway fork fix): Kong does NOT expand $(VAR) shell syntax in
# declarative config, so upstreams are hardcoded to the stable private
# hostnames/ports. Only true secrets (API keys) use vault references,
# which Kong resolves from environment variables at boot.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgREST — REST API ────────────────────────────────────────────────────
  - name: rest-v1
    url: http://rest.railway.internal:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  # ── GoTrue — Auth ───────────────────────────────────────────────────────────
  - name: auth-v1
    url: http://auth.railway.internal:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # ── Realtime ─────────────────────────────────────────────────────────────────
  - name: realtime-v1
    url: http://realtime.railway.internal:4000/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  # ── Storage ──────────────────────────────────────────────────────────────────
  - name: storage-v1
    url: http://storage.railway.internal:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  # ── Studio — ONLY accessible on private network (no public route) ────────────
  # Studio is intentionally NOT exposed through Kong.

# ── Global plugins ────────────────────────────────────────────────────────────
# NOTE: No key-auth here on purpose. Each upstream (PostgREST, GoTrue,
# Storage) validates the Supabase JWT itself — exactly like the official
# Supabase self-hosted kong.yml. The previous key-auth + vault setup
# rejected every request with 401, so it was removed.
plugins: []
